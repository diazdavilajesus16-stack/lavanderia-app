<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Lavandería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar: #0F1E33;
    --sidebar-hover: #1B2E4A;
    --sidebar-activo: #2B6CB0;
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #5B6B73;
    --line: #E2E6EA;

    --disponible: #2F9E44;
    --disponible-soft: #E6F6EA;
    --en-uso: #2B6CB0;
    --en-uso-soft: #E7F0FA;
    --finalizado: #E8590C;
    --finalizado-soft: #FCEBE0;
    --mantenimiento: #868E96;
    --mantenimiento-soft: #ECEDEE;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Inter", -apple-system, sans-serif;
  }
  h1, h2, h3, .num-maquina, .marca { font-family: "Outfit", "Inter", sans-serif; }

  .layout { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--sidebar); color: white;
    display: flex; flex-direction: column;
    position: fixed; top: 0; bottom: 0; left: 0;
    transition: transform .2s;
    z-index: 50;
  }
  .sidebar .marca {
    padding: 22px 20px 18px;
    font-size: 0.98rem; font-weight: 600;
    display: flex; align-items: center; gap: 11px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar .marca .logomark {
    width: 34px; height: 34px; border-radius: 9px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sidebar .marca .logomark svg { width: 18px; height: 18px; color: #74C0FC; }
  .sidebar .marca .sub { display: block; font-family: "Inter"; font-size: 0.68rem; font-weight: 400; color: #8FA0B3; margin-top: 1px; }
  .sidebar nav { flex: 1; padding: 14px 10px; }
  .sidebar .item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px; border-radius: 8px;
    font-size: 0.85rem; color: #A8B6C4; cursor: pointer;
    margin-bottom: 2px; user-select: none;
    transition: background .12s, color .12s;
  }
  .sidebar .item:hover { background: var(--sidebar-hover); color: white; }
  .sidebar .item.activo { background: var(--sidebar-activo); color: white; }
  .sidebar .item .ico { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sidebar .item .ico svg { width: 17px; height: 17px; }
  .sidebar .pie {
    padding: 14px 18px; font-size: 0.72rem; color: #8FA0B3;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar .pie .punto { width: 7px; height: 7px; border-radius: 50%; background: #51CF66; }

  .contenido { flex: 1; margin-left: 220px; min-width: 0; }

  /* ---------- Top bar ---------- */
  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 14px 26px; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
  }
  .topbar h1 { font-size: 1.05rem; margin: 0; }
  .topbar .acciones { display: flex; align-items: center; gap: 10px; }
  .estado-conexion {
    font-size: 0.74rem; padding: 5px 12px; border-radius: 20px;
    background: var(--disponible-soft); color: var(--disponible);
    display: flex; align-items: center; gap: 6px;
  }
  .estado-conexion::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--disponible); }
  .estado-conexion.mal { background: var(--finalizado-soft); color: var(--finalizado); }
  .estado-conexion.mal::before { background: var(--finalizado); }
  .menu-usuario { font-size: 0.82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .menu-usuario button {
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }

  .vista { padding: 22px 26px 40px; }
  .vista h2 { font-size: 1.15rem; margin: 0 0 2px; }
  .vista .subtitulo { font-size: 0.84rem; color: var(--muted); margin-bottom: 18px; }

  /* ---------- Tarjetas resumen ---------- */
  .tarjetas-resumen {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 22px;
  }
  .tr-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .tr-card .icono {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tr-card .icono svg { width: 19px; height: 19px; }
  .tr-card .num { font-size: 1.4rem; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  .tr-card .lbl { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

  /* ---------- Paneles / secciones ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .panel-header h3 { font-size: 0.95rem; margin: 0; }
  .panel-header .conteo { font-size: 0.76rem; color: var(--muted); }
  .panel-header a { font-size: 0.8rem; color: var(--en-uso); cursor: pointer; text-decoration: none; }

  .dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .dos-columnas { grid-template-columns: 1fr; } }

  /* ---------- Grid de máquinas ---------- */
  .grid-maquinas {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
    gap: 10px;
  }
  .maquina {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: border-color .15s, box-shadow .15s;
    box-shadow: 0 1px 2px rgba(16,24,40,0.03);
  }
  .maquina:hover { border-color: #C4CCD3; box-shadow: 0 2px 6px rgba(16,24,40,0.07); }
  .porthole { position: relative; width: 52px; height: 52px; }
  .porthole svg.anillo { width: 100%; height: 100%; transform: rotate(-90deg); position: absolute; inset: 0; }
  .porthole .pista { fill: none; stroke: var(--line); stroke-width: 5; }
  .porthole .progreso { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .porthole .icono-centro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .porthole .icono-centro svg { width: 20px; height: 20px; }
  .maquina.disponible .icono-centro { color: var(--disponible); }
  .maquina.en_uso .icono-centro { color: var(--en-uso); }
  .maquina.finalizado .icono-centro { color: var(--finalizado); }
  .maquina.mantenimiento .icono-centro { color: var(--mantenimiento); }
  .maquina.disponible .progreso { stroke: var(--disponible); }
  .maquina.en_uso .progreso { stroke: var(--en-uso); }
  .maquina.finalizado .progreso { stroke: var(--finalizado); }
  .maquina.mantenimiento .progreso { stroke: var(--mantenimiento); }
  .maquina.finalizado { border-color: var(--finalizado); }

  .num-maquina { font-size: 0.8rem; font-weight: 600; }
  .estado-txt { font-size: 0.63rem; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
  .maquina.disponible .estado-txt { color: var(--disponible); background: var(--disponible-soft); }
  .maquina.en_uso .estado-txt { color: var(--en-uso); background: var(--en-uso-soft); }
  .maquina.finalizado .estado-txt { color: var(--finalizado); background: var(--finalizado-soft); }
  .maquina.mantenimiento .estado-txt { color: var(--mantenimiento); background: var(--mantenimiento-soft); }
  .cliente-nombre { font-size: 0.72rem; font-weight: 600; text-align: center; }
  .tiempo-restante { font-size: 0.68rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .maquina.finalizado .tiempo-restante { color: var(--finalizado); font-weight: 600; }

  /* ---------- Filtros de lista ---------- */
  .filtros { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .filtros input, .filtros select {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 0.84rem; font-family: inherit; background: var(--surface);
  }
  .campo-busqueda { position: relative; flex: 1; min-width: 180px; }
  .campo-busqueda svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }
  .campo-busqueda input { width: 100%; padding-left: 34px; }

  /* ---------- Dona de estados ---------- */
  .dona-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .dona-svg { width: 130px; height: 130px; flex-shrink: 0; }
  .dona-centro-num { font-size: 1.5rem; font-weight: 700; }
  .dona-leyenda { font-size: 0.82rem; flex: 1; min-width: 140px; }
  .dona-leyenda .fila { display: flex; justify-content: space-between; padding: 5px 0; }
  .dona-leyenda .fila .etiqueta { display: flex; align-items: center; gap: 7px; color: var(--muted); }
  .dona-leyenda .dot { width: 9px; height: 9px; border-radius: 50%; }

  /* ---------- Actividad ---------- */
  .actividad-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.83rem; }
  .actividad-item:last-child { border-bottom: none; }
  .actividad-item .hora { color: var(--muted); font-size: 0.74rem; min-width: 42px; }
  .actividad-vacio { color: var(--muted); font-size: 0.84rem; padding: 8px 0; }

  /* ---------- Barras uso por hora ---------- */
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
  .barras .barra { flex: 1; background: var(--en-uso); border-radius: 3px 3px 0 0; min-height: 2px; }
  .barras-ejes { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--muted); margin-top: 4px; }

  /* ---------- Detalle de máquina ---------- */
  .detalle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .detalle-header .titulo-detalle { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 600; }
  .badge-estado { font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .badge-estado.disponible { color: var(--disponible); background: var(--disponible-soft); }
  .badge-estado.en_uso { color: var(--en-uso); background: var(--en-uso-soft); }
  .badge-estado.finalizado { color: var(--finalizado); background: var(--finalizado-soft); }
  .badge-estado.mantenimiento { color: var(--mantenimiento); background: var(--mantenimiento-soft); }
  .btn-volver {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    padding: 7px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
  }

  .info-linea { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
  .info-linea:last-child { border-bottom: none; }
  .info-linea span:first-child { color: var(--muted); }
  .info-linea span:last-child { font-weight: 600; text-align: right; }

  table.tabla-historial { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.tabla-historial th { text-align: left; color: var(--muted); font-weight: 600; padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 0.74rem; }
  table.tabla-historial td { padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .chip-completado { color: var(--disponible); background: var(--disponible-soft); font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; }
  .chip-en-curso { color: var(--en-uso); background: var(--en-uso-soft); font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; }

  /* ---------- Botones generales ---------- */
  .btn { padding: 10px 16px; border: none; border-radius: 9px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primario { background: var(--en-uso); color: white; }
  .btn-secundario { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn-liberar { background: var(--disponible); color: white; }
  .btn-whatsapp { background: #25D366; color: white; }
  .btn-peligro-texto { color: var(--finalizado); cursor: pointer; font-weight: 600; font-size: 0.82rem; }
  .fila-botones { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

  /* ---------- Overlay / hoja ---------- */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(15,30,51,0.5); z-index: 100; align-items: flex-end; justify-content: center; }
  .overlay.show { display: flex; }
  .hoja { background: var(--surface); width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); animation: subir .22s ease-out; }
  @keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (min-width: 640px) { .overlay { align-items: center; } .hoja { border-radius: 16px; } }
  .hoja .manija { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 16px; }
  @media (min-width: 640px) { .hoja .manija { display: none; } }
  .hoja h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .hoja .subtitulo2 { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
  .campo input, .campo select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 0.92rem; font-family: inherit; background: var(--bg); }

  /* ---------- Formulario configuración ---------- */
  .form-config { max-width: 420px; }

  /* Botón hamburguesa para móvil */
  .btn-menu { display: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--ink); }
  @media (max-width: 860px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.abierto { transform: translateX(0); }
    .contenido { margin-left: 0; }
    .btn-menu { display: block; }
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="marca">
      <span class="logomark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.2"/><path d="M8.5 6.2c-.3.7-.5 1.1-.9 1.5"/></svg></span>
      <span>Control de Lavandería<span class="sub" id="nombre-negocio-sub">Autoservicio</span></span>
    </div>
    <nav>
      <div class="item activo" data-vista="inicio" onclick="irAVista('inicio')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H10v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V20h3.5a1 1 0 0 0 1-1v-9"/></svg></span>
        Inicio
      </div>
      <div class="item" data-vista="lavadoras" onclick="irAVista('lavadoras')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M10.2 11.5a2.3 2.3 0 0 1 3.6 0"/><circle cx="7" cy="6" r=".6" fill="currentColor" stroke="none"/><circle cx="9.3" cy="6" r=".6" fill="currentColor" stroke="none"/></svg></span>
        Lavadoras
      </div>
      <div class="item" data-vista="secadoras" onclick="irAVista('secadoras')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M9.5 13a2.5 2.5 0 0 0 3.8 2.1"/><path d="M14.5 13a2.5 2.5 0 0 0-3.8-2.1"/></svg></span>
        Secadoras
      </div>
      <div class="item" data-vista="reportes" onclick="irAVista('reportes')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M11 20V4M18 20v-7"/></svg></span>
        Reportes
      </div>
      <div class="item" data-vista="usuarios" id="nav-usuarios" style="display:none;" onclick="irAVista('usuarios')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.3 3-5 5.5-5s4.9 1.7 5.5 5"/><path d="M16 4.8c1.4.4 2.4 1.6 2.4 3.2s-1 2.8-2.4 3.2"/><path d="M17 15.2c2 .5 3.4 1.9 3.9 4.8"/></svg></span>
        Usuarios
      </div>
      <div class="item" data-vista="configuracion" id="nav-config" style="display:none;" onclick="irAVista('configuracion')">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.6"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.2.7.7 1.2 1.5 1.4h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span>
        Configuración
      </div>
    </nav>
    <div class="pie"><span class="punto"></span> Sistema en línea · v1.0</div>
  </aside>

  <div class="contenido">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn-menu" onclick="document.getElementById('sidebar').classList.toggle('abierto')">☰</button>
        <h1 id="titulo-vista">Inicio</h1>
      </div>
      <div class="acciones">
        <span id="conexion" class="estado-conexion">Conectando</span>
        <div class="menu-usuario">
          <span id="usuario-info"></span>
          <button onclick="cerrarSesion()">Salir</button>
        </div>
      </div>
    </div>

    <div class="vista" id="vista-contenedor"></div>
  </div>
</div>

<!-- Hoja: iniciar ciclo -->
<div class="overlay" id="overlay-iniciar">
  <div class="hoja">
    <div class="manija"></div>
    <h2 id="titulo-iniciar">Asignar máquina</h2>
    <div class="subtitulo2">Ingresa los datos del cliente para iniciar el ciclo</div>
    <div class="campo"><label>Nombre del cliente</label><input type="text" id="input-nombre" placeholder="Ej: María"></div>
    <div class="campo"><label>Teléfono (opcional)</label><input type="text" id="input-telefono" placeholder="Ej: 987654321"></div>
    <div class="campo"><label>Duración del ciclo (minutos)</label><input type="number" id="input-duracion" placeholder="Ej: 35"></div>
    <div class="fila-botones">
      <button class="btn btn-secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primario" onclick="confirmarInicio()">Iniciar ciclo</button>
    </div>
  </div>
</div>

<script>
let maquinasCache = [];
let miUsuario = null;
let vistaActual = "inicio";
let maquinaDetalleId = null;
let filtroTexto = "";
let filtroEstado = "";
const RADIO = 24;
const CIRC = 2 * Math.PI * RADIO;
const COLORES_ESTADO = { disponible: "#2F9E44", en_uso: "#2B6CB0", finalizado: "#E8590C", mantenimiento: "#868E96" };
const NOMBRES_ESTADO = { disponible: "Disponibles", en_uso: "En uso", finalizado: "Ciclo terminado", mantenimiento: "Mantenimiento" };

const SVG_LAVADORA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M10.2 11.5a2.3 2.3 0 0 1 3.6 0"/><circle cx="7" cy="6" r=".6" fill="currentColor" stroke="none"/><circle cx="9.3" cy="6" r=".6" fill="currentColor" stroke="none"/></svg>`;
const SVG_SECADORA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M9.5 13a2.5 2.5 0 0 0 3.8 2.1"/><path d="M14.5 13a2.5 2.5 0 0 0-3.8-2.1"/></svg>`;
const SVG_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>`;
const SVG_RELOJ = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`;
const SVG_CAMPANA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17v-5.5a6 6 0 0 1 12 0V17l1.5 2H4.5L6 17Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`;
const SVG_LLAVE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 1 0-4.8 5.6L4 17.8V20h2.2l5.7-5.7a4 4 0 0 0 2.6-7.8Z"/></svg>`;
const SVG_CICLO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14.1-5.1M20 12a8 8 0 0 1-14.1 5.1"/><path d="M18.5 3.5V7H15M5.5 20.5V17H9"/></svg>`;
const SVG_CHAT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4 8.5 8.5 0 0 1-4-1L4 20l1.1-4.6a8.4 8.4 0 1 1 15.9-3.9Z"/></svg>`;
const SVG_BUSCAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.5-3.5"/></svg>`;

function iconoTipo(tipo) { return tipo === "lavadora" ? SVG_LAVADORA : SVG_SECADORA; }
function iconoTipoGrande(tipo) { return `<span style="width:22px; height:22px; display:inline-flex;">${iconoTipo(tipo)}</span>`; }

function calcularProgreso(m) {
  if (m.estado === "en_uso" && m.sesion) {
    const inicio = new Date(m.sesion.hora_inicio + "Z").getTime();
    const fin = new Date(m.sesion.hora_fin_estimada + "Z").getTime();
    const ahora = Date.now();
    return Math.min(1, Math.max(0, (ahora - inicio) / (fin - inicio)));
  }
  if (m.estado === "finalizado") return 1;
  return 0;
}

function formatearRestante(finISO) {
  const diffMs = Math.max(0, new Date(finISO + "Z") - new Date());
  const totalSeg = Math.floor(diffMs / 1000);
  return `${Math.floor(totalSeg / 60)}:${(totalSeg % 60).toString().padStart(2, "0")}`;
}

function formatearFechaHora(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "Z");
  return d.toLocaleString("es-PE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function porthole(m) {
  const pct = calcularProgreso(m);
  const offset = CIRC * (1 - pct);
  return `<div class="porthole"><svg class="anillo" viewBox="0 0 60 60">
      <circle class="pista" cx="30" cy="30" r="${RADIO}"></circle>
      <circle class="progreso" cx="30" cy="30" r="${RADIO}" stroke-dasharray="${CIRC}" stroke-dashoffset="${offset}"></circle>
    </svg><div class="icono-centro">${iconoTipo(m.tipo)}</div></div>`;
}

function tarjetaMaquina(m) {
  let extra = "";
  if (m.estado === "en_uso" && m.sesion) {
    extra = `<div class="cliente-nombre">${m.sesion.cliente_nombre}</div><div class="tiempo-restante" data-fin="${m.sesion.hora_fin_estimada}">${formatearRestante(m.sesion.hora_fin_estimada)}</div>`;
  } else if (m.estado === "finalizado" && m.sesion) {
    extra = `<div class="cliente-nombre">${m.sesion.cliente_nombre}</div><div class="tiempo-restante">Listo</div>`;
  }
  return `<div class="maquina ${m.estado}" onclick="irADetalle(${m.id})">
      ${porthole(m)}
      <div class="num-maquina">${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${String(m.numero).padStart(2,"0")}</div>
      <div class="estado-txt">${NOMBRES_ESTADO[m.estado]}</div>
      ${extra}
    </div>`;
}

// ---------- Navegación ----------
function irAVista(vista) {
  vistaActual = vista;
  maquinaDetalleId = null;
  document.querySelectorAll(".sidebar .item").forEach(el => el.classList.toggle("activo", el.dataset.vista === vista));
  const titulos = { inicio: "Inicio", lavadoras: "Lavadoras", secadoras: "Secadoras", reportes: "Reportes", usuarios: "Usuarios", configuracion: "Configuración", detalle: "Detalle de máquina" };
  document.getElementById("titulo-vista").textContent = titulos[vista] || "";
  document.getElementById("sidebar").classList.remove("abierto");
  render();
}

function irADetalle(id) {
  maquinaDetalleId = id;
  vistaActual = "detalle";
  document.getElementById("titulo-vista").textContent = "Detalle de máquina";
  document.querySelectorAll(".sidebar .item").forEach(el => el.classList.remove("activo"));
  render();
}

// ---------- Render dispatcher ----------
function render() {
  const cont = document.getElementById("vista-contenedor");
  if (vistaActual === "inicio") { cont.innerHTML = vistaInicio(); cargarActividadEnVista("actividad-inicio"); }
  else if (vistaActual === "lavadoras") cont.innerHTML = vistaListaMaquinas("lavadora");
  else if (vistaActual === "secadoras") cont.innerHTML = vistaListaMaquinas("secadora");
  else if (vistaActual === "detalle") renderDetalle(cont);
  else if (vistaActual === "reportes") renderReportes(cont);
  else if (vistaActual === "usuarios") renderUsuarios(cont);
  else if (vistaActual === "configuracion") renderConfiguracion(cont);
}

// ---------- Vista: Inicio ----------
function vistaInicio() {
  const conteos = { disponible: 0, en_uso: 0, finalizado: 0, mantenimiento: 0 };
  maquinasCache.forEach(m => conteos[m.estado]++);
  const lavadoras = maquinasCache.filter(m => m.tipo === "lavadora").slice(0, 12);
  const secadoras = maquinasCache.filter(m => m.tipo === "secadora").slice(0, 12);

  return `
    <div class="tarjetas-resumen">
      <div class="tr-card"><span class="icono" style="background:var(--disponible-soft); color:var(--disponible);">${SVG_CHECK}</span><div><div class="num">${conteos.disponible}</div><div class="lbl">Disponibles</div></div></div>
      <div class="tr-card"><span class="icono" style="background:var(--en-uso-soft); color:var(--en-uso);">${SVG_RELOJ}</span><div><div class="num">${conteos.en_uso}</div><div class="lbl">En uso</div></div></div>
      <div class="tr-card"><span class="icono" style="background:var(--finalizado-soft); color:var(--finalizado);">${SVG_CAMPANA}</span><div><div class="num">${conteos.finalizado}</div><div class="lbl">Ciclo terminado</div></div></div>
      <div class="tr-card"><span class="icono" style="background:var(--mantenimiento-soft); color:var(--mantenimiento);">${SVG_LLAVE}</span><div><div class="num">${conteos.mantenimiento}</div><div class="lbl">Mantenimiento</div></div></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h3>Lavadoras</h3><span class="conteo">${conteos_de_tipo("lavadora")}</span><a onclick="irAVista('lavadoras')">Ver todas →</a></div>
      <div class="grid-maquinas">${lavadoras.map(tarjetaMaquina).join("")}</div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3>Secadoras</h3><span class="conteo">${conteos_de_tipo("secadora")}</span><a onclick="irAVista('secadoras')">Ver todas →</a></div>
      <div class="grid-maquinas">${secadoras.map(tarjetaMaquina).join("")}</div>
    </div>

    <div class="dos-columnas">
      <div class="panel">
        <div class="panel-header"><h3>Máquinas por estado</h3></div>
        <div id="dona-inicio">${donaEstados(conteos)}</div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Actividad reciente</h3></div>
        <div id="actividad-inicio">Cargando…</div>
      </div>
    </div>
  `;
}

function conteos_de_tipo(tipo) {
  const total = maquinasCache.filter(m => m.tipo === tipo).length;
  const disp = maquinasCache.filter(m => m.tipo === tipo && m.estado === "disponible").length;
  return `${disp} disponibles de ${total}`;
}

function donaEstados(conteos) {
  const total = Object.values(conteos).reduce((a, b) => a + b, 0) || 1;
  let acumulado = 0;
  const segmentos = Object.entries(conteos).map(([estado, cant]) => {
    const frac = cant / total;
    const dash = frac * CIRC_DONA;
    const seg = `<circle class="pista-dona" cx="50" cy="50" r="${RADIO_DONA}" stroke="${COLORES_ESTADO[estado]}"
        stroke-dasharray="${dash} ${CIRC_DONA - dash}" stroke-dashoffset="${-acumulado}"></circle>`;
    acumulado += dash;
    return seg;
  }).join("");

  const leyenda = Object.entries(conteos).map(([estado, cant]) => `
    <div class="fila"><span class="etiqueta"><span class="dot" style="background:${COLORES_ESTADO[estado]}"></span>${NOMBRES_ESTADO[estado]}</span><span>${cant}</span></div>
  `).join("");

  return `<div class="dona-wrap">
    <svg class="dona-svg" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${RADIO_DONA}" fill="none" stroke="#EEF1F3" stroke-width="12"></circle>
      <g transform="rotate(-90 50 50)" style="fill:none; stroke-width:12;">${segmentos}</g>
      <text x="50" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${Object.values(conteos).reduce((a,b)=>a+b,0)}</text>
      <text x="50" y="61" text-anchor="middle" font-size="7" fill="var(--muted)">Total</text>
    </svg>
    <div class="dona-leyenda">${leyenda}</div>
  </div>`;
}
const RADIO_DONA = 40;
const CIRC_DONA = 2 * Math.PI * RADIO_DONA;

async function cargarActividadEnVista(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  try {
    const resp = await fetch("/api/actividad");
    if (!resp.ok) return;
    const eventos = await resp.json();
    if (!eventos.length) { el.innerHTML = `<div class="actividad-vacio">Todavía no hay actividad registrada.</div>`; return; }
    el.innerHTML = eventos.map(e => {
      const hora = new Date(e.hora + "Z").toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
      return `<div class="actividad-item"><span class="hora">${hora}</span><span>${e.texto}</span></div>`;
    }).join("");
  } catch (e) { /* silencioso */ }
}

// ---------- Vista: lista de lavadoras/secadoras ----------
function vistaListaMaquinas(tipo) {
  const titulo = tipo === "lavadora" ? "Lavadoras" : "Secadoras";
  let lista = maquinasCache.filter(m => m.tipo === tipo);
  if (filtroTexto) lista = lista.filter(m => String(m.numero).includes(filtroTexto));
  if (filtroEstado) lista = lista.filter(m => m.estado === filtroEstado);

  return `
    <div class="panel">
      <div class="panel-header"><h3>${titulo}</h3><span class="conteo">${conteos_de_tipo(tipo)}</span></div>
      <div class="filtros">
        <div class="campo-busqueda">
          ${SVG_BUSCAR}
          <input type="text" placeholder="Buscar por número..." value="${filtroTexto}" oninput="filtroTexto=this.value; render()">
        </div>
        <select onchange="filtroEstado=this.value; render()">
          <option value="">Todos los estados</option>
          <option value="disponible" ${filtroEstado==="disponible"?"selected":""}>Disponible</option>
          <option value="en_uso" ${filtroEstado==="en_uso"?"selected":""}>En uso</option>
          <option value="finalizado" ${filtroEstado==="finalizado"?"selected":""}>Ciclo terminado</option>
          <option value="mantenimiento" ${filtroEstado==="mantenimiento"?"selected":""}>Mantenimiento</option>
        </select>
      </div>
      <div class="grid-maquinas">${lista.map(tarjetaMaquina).join("") || "<span style='color:var(--muted); font-size:0.85rem;'>No hay máquinas que coincidan con el filtro.</span>"}</div>
    </div>
  `;
}

// ---------- Vista: Detalle ----------
function renderDetalle(cont) {
  const m = maquinasCache.find(x => x.id === maquinaDetalleId);
  if (!m) { cont.innerHTML = "<div class='panel'>Máquina no encontrada.</div>"; return; }
  const nombre = `${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${String(m.numero).padStart(2, "0")}`;
  const s = m.sesion;

  let acciones = "";
  if (m.estado === "disponible") {
    acciones = `<button class="btn btn-primario" onclick="abrirIniciar(${m.id})">Iniciar ciclo</button>
                <button class="btn btn-secundario" onclick="alternarMantenimiento(${m.id})">Marcar en mantenimiento</button>`;
  } else if (m.estado === "en_uso") {
    acciones = `<button class="btn btn-secundario" disabled style="opacity:0.6;">En funcionamiento — espera a que termine</button>`;
  } else if (m.estado === "finalizado") {
    acciones = `<button class="btn btn-whatsapp" onclick="avisarWhatsApp(${m.id})"><span style="width:15px; height:15px; display:inline-flex; vertical-align:-3px; margin-right:5px;">${SVG_CHAT}</span>Avisar por WhatsApp</button>
                <button class="btn btn-liberar" onclick="liberarMaquina(${m.id})">Ropa recogida</button>`;
  } else if (m.estado === "mantenimiento") {
    acciones = `<button class="btn btn-primario" onclick="alternarMantenimiento(${m.id})">Quitar de mantenimiento</button>`;
  }

  cont.innerHTML = `
    <div class="detalle-header">
      <div class="titulo-detalle"><span style="color:var(--muted); display:flex;">${iconoTipoGrande(m.tipo)}</span>${nombre} <span class="badge-estado ${m.estado}">${NOMBRES_ESTADO[m.estado]}</span></div>
      <button class="btn-volver" onclick="volverDeDetalle()">← Volver</button>
    </div>
    <div class="dos-columnas">
      <div class="panel">
        <h3 style="margin-top:0; font-size:0.9rem;">Información general</h3>
        <div class="info-linea"><span>Tipo</span><span>${m.tipo === "lavadora" ? "Lavadora" : "Secadora"}</span></div>
        <div class="info-linea"><span>Estado</span><span>${NOMBRES_ESTADO[m.estado]}</span></div>
        ${s ? `
          <div class="info-linea"><span>Cliente</span><span>${s.cliente_nombre}</span></div>
          <div class="info-linea"><span>Teléfono</span><span>${s.cliente_telefono || "No registrado"}</span></div>
          <div class="info-linea"><span>Duración del ciclo</span><span>${s.duracion_minutos} min</span></div>
          ${m.estado === "en_uso" ? `<div class="info-linea"><span>Tiempo restante</span><span data-fin-detalle="${s.hora_fin_estimada}">${formatearRestante(s.hora_fin_estimada)}</span></div>` : ""}
        ` : `<div class="info-linea"><span>Cliente</span><span>—</span></div>`}
        <div class="fila-botones">${acciones}</div>
      </div>
      <div class="panel">
        <h3 style="margin-top:0; font-size:0.9rem;">Historial de ciclos</h3>
        <div id="historial-tabla">Cargando…</div>
      </div>
    </div>
  `;
  cargarHistorial(m.id);
}

async function cargarHistorial(maquinaId) {
  const el = document.getElementById("historial-tabla");
  if (!el) return;
  try {
    const resp = await fetch(`/api/maquinas/${maquinaId}/historial`);
    if (!resp.ok) return;
    const ciclos = await resp.json();
    if (!ciclos.length) { el.innerHTML = `<div class="actividad-vacio">Esta máquina todavía no tiene ciclos registrados.</div>`; return; }
    el.innerHTML = `<table class="tabla-historial">
      <thead><tr><th>Fecha</th><th>Cliente</th><th>Duración</th><th>Estado</th></tr></thead>
      <tbody>${ciclos.map(c => `
        <tr>
          <td>${formatearFechaHora(c.hora_inicio)}</td>
          <td>${c.cliente_nombre}</td>
          <td>${c.duracion_minutos} min</td>
          <td>${c.completado ? '<span class="chip-completado">Completado</span>' : '<span class="chip-en-curso">En curso</span>'}</td>
        </tr>`).join("")}</tbody>
    </table>`;
  } catch (e) { /* silencioso */ }
}

function volverDeDetalle() {
  const m = maquinasCache.find(x => x.id === maquinaDetalleId);
  irAVista(m && m.tipo === "secadora" ? "secadoras" : "lavadoras");
}

// ---------- Vista: Reportes ----------
async function renderReportes(cont) {
  cont.innerHTML = `<div class="panel">Cargando reportes…</div>`;
  try {
    const resp = await fetch("/api/reportes");
    if (!resp.ok) return;
    const data = await resp.json();
    const conteos = { disponible: 0, en_uso: 0, finalizado: 0, mantenimiento: 0 };
    data.maquinas.forEach(m => conteos[m.estado]++);

    const maxUso = Math.max(1, ...data.uso_por_hora_hoy);
    const barras = data.uso_por_hora_hoy.map(v => `<div class="barra" style="height:${(v/maxUso*100) || 2}%;" title="${v} ciclo(s)"></div>`).join("");

    cont.innerHTML = `
      <div class="tarjetas-resumen">
        <div class="tr-card"><span class="icono" style="background:var(--en-uso-soft); color:var(--en-uso);">${SVG_CICLO}</span><div><div class="num">${data.ciclos_iniciados_hoy}</div><div class="lbl">Ciclos iniciados hoy</div></div></div>
        <div class="tr-card"><span class="icono" style="background:var(--disponible-soft); color:var(--disponible);">${SVG_LAVADORA}</span><div><div class="num">${data.promedio_duracion_lavadora ?? "—"}</div><div class="lbl">Prom. min · lavadora</div></div></div>
        <div class="tr-card"><span class="icono" style="background:var(--mantenimiento-soft); color:var(--mantenimiento);">${SVG_SECADORA}</span><div><div class="num">${data.promedio_duracion_secadora ?? "—"}</div><div class="lbl">Prom. min · secadora</div></div></div>
      </div>
      <div class="dos-columnas">
        <div class="panel">
          <div class="panel-header"><h3>Máquinas por estado</h3></div>
          ${donaEstados(conteos)}
        </div>
        <div class="panel">
          <div class="panel-header"><h3>Ciclos iniciados por hora — hoy</h3></div>
          <div class="barras">${barras}</div>
          <div class="barras-ejes"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><h3>Actividad reciente</h3></div>
        <div id="actividad-reportes">Cargando…</div>
      </div>
    `;
    cargarActividadEnVista("actividad-reportes");
  } catch (e) { cont.innerHTML = `<div class="panel">No se pudo cargar el reporte.</div>`; }
}

// ---------- Vista: Usuarios ----------
async function renderUsuarios(cont) {
  cont.innerHTML = `<div class="panel">Cargando usuarios…</div>`;
  const resp = await fetch("/api/usuarios");
  if (!resp.ok) { cont.innerHTML = `<div class="panel">No tienes acceso a esta sección.</div>`; return; }
  const usuarios = await resp.json();

  cont.innerHTML = `
    <div class="panel">
      <div class="panel-header"><h3>Usuarios con acceso</h3></div>
      <div id="lista-usuarios">${usuarios.map(u => `
        <div class="info-linea">
          <span>${u.nombre} <span style="color:var(--muted); font-size:0.75rem;">(${u.username} · ${u.rol === "dueno" ? "Dueño" : "Personal"})</span></span>
          ${u.id !== miUsuario.id ? `<span class="btn-peligro-texto" onclick="eliminarUsuario(${u.id})">Quitar</span>` : `<span style="color:var(--muted); font-size:0.78rem;">Tú</span>`}
        </div>`).join("")}</div>
    </div>
    <div class="panel form-config">
      <div class="panel-header"><h3>Agregar usuario</h3></div>
      <div class="campo"><label>Nombre</label><input type="text" id="nu-nombre" placeholder="Ej: Carlos (turno tarde)"></div>
      <div class="campo"><label>Usuario</label><input type="text" id="nu-username" placeholder="Ej: carlos"></div>
      <div class="campo"><label>Contraseña</label><input type="text" id="nu-password" placeholder="Contraseña temporal"></div>
      <div class="campo"><label>Rol</label>
        <select id="nu-rol"><option value="personal">Personal</option><option value="dueno">Dueño</option></select>
      </div>
      <button class="btn btn-primario" onclick="crearUsuario()">Agregar usuario</button>
    </div>
  `;
}

async function crearUsuario() {
  const nombre = document.getElementById("nu-nombre").value.trim();
  const username = document.getElementById("nu-username").value.trim();
  const password = document.getElementById("nu-password").value;
  const rol = document.getElementById("nu-rol").value;
  if (!nombre || !username || !password) { alert("Completa todos los campos."); return; }
  const resp = await fetch("/api/usuarios", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nombre, username, password, rol }) });
  if (!resp.ok) { const d = await resp.json().catch(() => ({})); alert(d.detail || "No se pudo crear el usuario."); return; }
  irAVista("usuarios");
}

async function eliminarUsuario(id) {
  if (!confirm("¿Quitar el acceso a este usuario?")) return;
  await fetch(`/api/usuarios/${id}`, { method: "DELETE" });
  irAVista("usuarios");
}

// ---------- Vista: Configuración ----------
async function renderConfiguracion(cont) {
  cont.innerHTML = `<div class="panel">Cargando configuración…</div>`;
  const resp = await fetch("/api/configuracion");
  if (!resp.ok) { cont.innerHTML = `<div class="panel">No tienes acceso a esta sección.</div>`; return; }
  const config = await resp.json();
  cont.innerHTML = `
    <div class="panel form-config">
      <div class="panel-header"><h3>Configuración general</h3></div>
      <div class="campo"><label>Nombre del negocio</label><input type="text" id="cfg-nombre" value="${config.nombre_negocio}"></div>
      <div class="campo"><label>Duración por defecto — Lavadoras (min)</label><input type="number" id="cfg-lavadora" value="${config.duracion_default_lavadora}"></div>
      <div class="campo"><label>Duración por defecto — Secadoras (min)</label><input type="number" id="cfg-secadora" value="${config.duracion_default_secadora}"></div>
      <button class="btn btn-primario" onclick="guardarConfiguracion()">Guardar cambios</button>
    </div>
  `;
}

async function guardarConfiguracion() {
  const body = {
    nombre_negocio: document.getElementById("cfg-nombre").value,
    duracion_default_lavadora: parseInt(document.getElementById("cfg-lavadora").value, 10),
    duracion_default_secadora: parseInt(document.getElementById("cfg-secadora").value, 10),
  };
  const resp = await fetch("/api/configuracion", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (resp.ok) {
    document.getElementById("nombre-negocio-sub").textContent = body.nombre_negocio;
    alert("Configuración guardada.");
  } else {
    alert("No se pudo guardar.");
  }
}

// ---------- Modal iniciar ciclo ----------
let maquinaParaIniciar = null;
function abrirIniciar(id) {
  maquinaParaIniciar = maquinasCache.find(m => m.id === id);
  document.getElementById("titulo-iniciar").textContent = `${maquinaParaIniciar.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${maquinaParaIniciar.numero}`;
  document.getElementById("input-nombre").value = "";
  document.getElementById("input-telefono").value = "";
  document.getElementById("input-duracion").value = "";
  document.getElementById("overlay-iniciar").classList.add("show");
}
function cerrarModal() { document.getElementById("overlay-iniciar").classList.remove("show"); maquinaParaIniciar = null; }

async function confirmarInicio() {
  const nombre = document.getElementById("input-nombre").value.trim();
  const telefono = document.getElementById("input-telefono").value.trim();
  const duracion = parseInt(document.getElementById("input-duracion").value, 10);
  if (!nombre) { alert("Por favor ingresa el nombre del cliente."); return; }
  await fetch(`/api/maquinas/${maquinaParaIniciar.id}/iniciar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cliente_nombre: nombre, cliente_telefono: telefono || null, duracion_minutos: duracion || null }),
  });
  cerrarModal();
}

async function liberarMaquina(id) {
  await fetch(`/api/maquinas/${id}/liberar`, { method: "POST" });
}

async function alternarMantenimiento(id) {
  await fetch(`/api/maquinas/${id}/mantenimiento`, { method: "POST" });
}

function formatearNumeroPeru(telefono) {
  let limpio = telefono.replace(/[^0-9]/g, "");
  if (limpio.length === 9) limpio = "51" + limpio;
  return limpio;
}

async function avisarWhatsApp(id) {
  const m = maquinasCache.find(x => x.id === id);
  const s = m.sesion;
  let telefono = s.cliente_telefono;
  if (!telefono) {
    telefono = prompt("No hay teléfono registrado para este cliente.\nIngresa el número de WhatsApp:");
    if (!telefono) return;
    await fetch(`/api/maquinas/${id}/telefono`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ telefono }) });
  }
  const numero = formatearNumeroPeru(telefono);
  const nombreMaquina = `${m.tipo === "lavadora" ? "lavadora" : "secadora"} ${m.numero}`;
  const mensaje = `Hola ${s.cliente_nombre}, tu ropa en la ${nombreMaquina} ya está lista. Puedes pasar a recogerla cuando gustes. ¡Gracias por tu preferencia!`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`, "_blank");
}

// ---------- Alerta sonora ----------
let estadosAnteriores = {};
let audioCtx = null;
function reproducirAlerta() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = audioCtx.currentTime;
    [0, 0.18].forEach(retraso => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ahora + retraso);
      gain.gain.exponentialRampToValueAtTime(0.25, ahora + retraso + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + retraso + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(ahora + retraso); osc.stop(ahora + retraso + 0.4);
    });
  } catch (e) {}
}
function detectarNuevosFinalizados(maquinas) {
  let hayNuevo = false;
  maquinas.forEach(m => {
    const anterior = estadosAnteriores[m.id];
    if (m.estado === "finalizado" && anterior && anterior !== "finalizado") hayNuevo = true;
    estadosAnteriores[m.id] = m.estado;
  });
  if (hayNuevo) reproducirAlerta();
}

// ---------- Usuario / sesión ----------
async function cargarUsuarioActual() {
  const resp = await fetch("/api/me");
  if (resp.status === 401) { window.location.href = "/login"; return; }
  miUsuario = await resp.json();
  document.getElementById("usuario-info").textContent = miUsuario.nombre;
  if (miUsuario.rol === "dueno") {
    document.getElementById("nav-usuarios").style.display = "flex";
    document.getElementById("nav-config").style.display = "flex";
  }
}
async function cerrarSesion() { await fetch("/api/logout", { method: "POST" }); window.location.href = "/login"; }

// ---------- WebSocket ----------
function conectarWS() {
  const protocolo = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${protocolo}://${window.location.host}/ws`);
  const badge = document.getElementById("conexion");
  ws.onopen = () => { badge.textContent = "En vivo"; badge.className = "estado-conexion"; };
  ws.onclose = (event) => {
    if (event.code === 4401) { window.location.href = "/login"; return; }
    badge.textContent = "Reconectando…"; badge.className = "estado-conexion mal";
    setTimeout(conectarWS, 2000);
  };
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.evento === "actualizacion") {
      detectarNuevosFinalizados(data.maquinas);
      maquinasCache = data.maquinas;
      render();
    }
  };
}

setInterval(() => {
  document.querySelectorAll(".tiempo-restante[data-fin]").forEach(el => { el.textContent = formatearRestante(el.getAttribute("data-fin")); });
  document.querySelectorAll("[data-fin-detalle]").forEach(el => { el.textContent = formatearRestante(el.getAttribute("data-fin-detalle")); });
  if (maquinasCache.some(m => m.estado === "en_uso")) render();
}, 1000);

(async function iniciar() {
  await cargarUsuarioActual();
  conectarWS();
})();
</script>
