<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Lavandería — Autoservicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EFF2EF;
    --surface: #FFFFFF;
    --ink: #1B2430;
    --muted: #5B6B73;
    --line: #DDE3E0;

    --disponible: #2F9E44;
    --disponible-soft: #E6F6EA;
    --en-uso: #2B6CB0;
    --en-uso-soft: #E7F0FA;
    --finalizado: #E8590C;
    --finalizado-soft: #FCEBE0;
    --mantenimiento: #868E96;
    --mantenimiento-soft: #ECEDEE;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, sans-serif;
  }
  h1, h2, .num-maquina { font-family: "Outfit", "Inter", sans-serif; }

  /* ---------- Encabezado ---------- */
  header {
    background: var(--ink);
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header h1 .sub {
    display: block;
    font-family: "Inter";
    font-size: 0.72rem;
    font-weight: 400;
    color: #9DA9B3;
    margin-top: 2px;
  }
  .estado-conexion {
    font-size: 0.74rem;
    padding: 5px 12px;
    border-radius: 20px;
    background: #3A4756;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .estado-conexion::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #E8590C;
  }
  .estado-conexion.ok::before { background: #51CF66; }
  .estado-conexion.mal::before { background: #FF6B6B; }

  /* ---------- Leyenda ---------- */
  .leyenda {
    display: flex;
    gap: 18px;
    padding: 12px 24px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .leyenda span { display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---------- Secciones ---------- */
  .seccion-titulo {
    padding: 22px 24px 6px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .seccion-titulo .conteo {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--muted);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
    gap: 10px;
    padding: 8px 24px 24px;
  }

  /* ---------- Tarjeta "porthole" ---------- */
  .maquina {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .maquina:active { transform: scale(0.98); }
  .maquina:hover { border-color: var(--muted); }

  .porthole { position: relative; width: 66px; height: 66px; }
  .porthole svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .porthole .pista { fill: none; stroke: var(--line); stroke-width: 6; }
  .porthole .progreso { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .porthole .icono-centro {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem;
  }

  .maquina.disponible .progreso { stroke: var(--disponible); }
  .maquina.en_uso .progreso { stroke: var(--en-uso); }
  .maquina.finalizado .progreso { stroke: var(--finalizado); }
  .maquina.mantenimiento .progreso { stroke: var(--mantenimiento); }

  .num-maquina { font-size: 0.86rem; font-weight: 600; }
  .estado-txt {
    font-size: 0.66rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .maquina.disponible .estado-txt { color: var(--disponible); background: var(--disponible-soft); }
  .maquina.en_uso .estado-txt { color: var(--en-uso); background: var(--en-uso-soft); }
  .maquina.finalizado .estado-txt { color: var(--finalizado); background: var(--finalizado-soft); }
  .maquina.mantenimiento .estado-txt { color: var(--mantenimiento); background: var(--mantenimiento-soft); }

  .cliente-nombre { font-size: 0.78rem; font-weight: 600; color: var(--ink); text-align: center; }
  .tiempo-restante { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .maquina.finalizado .tiempo-restante { color: var(--finalizado); font-weight: 600; }

  /* pulso sutil solo en máquinas que ya terminaron: llama la atención sin animar todo el grid */
  .maquina.finalizado .porthole { animation: respirar 1.8s ease-in-out infinite; }
  @keyframes respirar {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(232,89,12,0)); }
    50% { filter: drop-shadow(0 0 6px rgba(232,89,12,0.45)); }
  }

  /* ---------- Overlay + hoja inferior (mobile) / modal (desktop) ---------- */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(27,36,48,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .hoja {
    background: var(--surface);
    width: 100%;
    max-width: 420px;
    border-radius: 20px 20px 0 0;
    padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px));
    animation: subir .22s ease-out;
  }
  @keyframes subir { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (min-width: 640px) {
    .overlay { align-items: center; }
    .hoja { border-radius: 16px; margin-bottom: 0; }
  }

  .hoja .manija {
    width: 36px; height: 4px; background: var(--line); border-radius: 4px;
    margin: 0 auto 16px;
  }
  @media (min-width: 640px) { .hoja .manija { display: none; } }

  .hoja h2 { margin: 0 0 4px; font-size: 1.05rem; }
  .hoja .subtitulo { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }

  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
  .campo input {
    width: 100%; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 0.92rem; font-family: inherit;
    background: var(--bg);
  }
  .campo input:focus { outline: 2px solid var(--en-uso); outline-offset: 1px; }

  .fila-botones { display: flex; gap: 10px; margin-top: 18px; }
  .fila-botones button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primario { background: var(--en-uso); color: white; }
  .btn-secundario { background: var(--bg); color: var(--ink); border: 1px solid var(--line) !important; }
  .btn-liberar { background: var(--disponible); color: white; }
  .btn-whatsapp { background: #25D366; color: white; }

  .fila-botones.tres { flex-wrap: wrap; }
  .fila-botones.tres button { min-width: 100px; }

  .info-linea {
    display: flex; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font-size: 0.86rem;
  }
  .info-linea span:first-child { color: var(--muted); }
  .info-linea span:last-child { font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Control de Lavandería
    <span class="sub">Autoservicio — Lavadoras y secadoras</span>
  </h1>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="conexion" class="estado-conexion">Conectando</span>
    <span id="usuario-info" style="font-size:0.82rem; color:#9DA9B3;"></span>
    <button id="btn-usuarios" onclick="abrirUsuarios()" style="display:none; background:#3A4756; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:0.78rem; cursor:pointer;">Usuarios</button>
    <button onclick="cerrarSesion()" style="background:#3A4756; color:white; border:none; padding:6px 12px; border-radius:8px; font-size:0.78rem; cursor:pointer;">Salir</button>
  </div>
</header>

<div class="leyenda">
  <span><span class="dot" style="background:var(--disponible)"></span>Disponible</span>
  <span><span class="dot" style="background:var(--en-uso)"></span>En uso</span>
  <span><span class="dot" style="background:var(--finalizado)"></span>Ciclo terminado</span>
  <span><span class="dot" style="background:var(--mantenimiento)"></span>Mantenimiento</span>
</div>

<div class="seccion-titulo">Lavadoras <span class="conteo" id="conteo-lavadoras"></span></div>
<div class="grid" id="grid-lavadoras"></div>

<div class="seccion-titulo">Secadoras <span class="conteo" id="conteo-secadoras"></span></div>
<div class="grid" id="grid-secadoras"></div>

<!-- Hoja: iniciar ciclo -->
<div class="overlay" id="overlay-iniciar">
  <div class="hoja">
    <div class="manija"></div>
    <h2 id="titulo-iniciar">Asignar máquina</h2>
    <div class="subtitulo">Ingresa los datos del cliente para iniciar el ciclo</div>
    <div class="campo">
      <label>Nombre del cliente</label>
      <input type="text" id="input-nombre" placeholder="Ej: María">
    </div>
    <div class="campo">
      <label>Teléfono (opcional)</label>
      <input type="text" id="input-telefono" placeholder="Ej: 987654321">
    </div>
    <div class="campo">
      <label>Duración del ciclo (minutos)</label>
      <input type="number" id="input-duracion" placeholder="Ej: 35">
    </div>
    <div class="fila-botones">
      <button class="btn-secundario" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-primario" onclick="confirmarInicio()">Iniciar ciclo</button>
    </div>
  </div>
</div>

<!-- Hoja: detalle / liberar -->
<div class="overlay" id="overlay-detalle">
  <div class="hoja">
    <div class="manija"></div>
    <h2 id="titulo-detalle">Máquina</h2>
    <div id="detalle-contenido" style="margin-top: 10px;"></div>
    <div class="fila-botones tres">
      <button class="btn-secundario" onclick="cerrarModal()">Cerrar</button>
      <button class="btn-whatsapp" id="btn-whatsapp" onclick="avisarWhatsApp()" style="display:none;">Avisar por WhatsApp</button>
      <button class="btn-liberar" id="btn-liberar" onclick="confirmarLiberar()">Ropa recogida</button>
    </div>
  </div>
</div>

<!-- Hoja: gestión de usuarios (solo dueño) -->
<div class="overlay" id="overlay-usuarios">
  <div class="hoja" style="max-width: 460px;">
    <div class="manija"></div>
    <h2>Usuarios con acceso</h2>
    <div class="subtitulo">Solo el dueño puede agregar o quitar personal</div>

    <div id="lista-usuarios" style="margin-bottom: 18px;"></div>

    <div style="border-top: 1px solid var(--line); padding-top: 16px;">
      <div class="campo">
        <label>Nombre</label>
        <input type="text" id="nu-nombre" placeholder="Ej: Carlos (turno tarde)">
      </div>
      <div class="campo">
        <label>Usuario</label>
        <input type="text" id="nu-username" placeholder="Ej: carlos">
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="text" id="nu-password" placeholder="Contraseña temporal">
      </div>
      <div class="campo">
        <label>Rol</label>
        <select id="nu-rol" style="width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:0.92rem; background:var(--bg);">
          <option value="personal">Personal</option>
          <option value="dueno">Dueño</option>
        </select>
      </div>
      <button class="btn-primario" style="width:100%; padding:12px; border:none; border-radius:10px; font-weight:600; cursor:pointer;" onclick="crearUsuario()">Agregar usuario</button>
    </div>
    <div class="fila-botones">
      <button class="btn-secundario" onclick="cerrarModalUsuarios()">Cerrar</button>
    </div>
  </div>
</div>

<script>
let maquinaSeleccionada = null;
let maquinasCache = [];
let miUsuario = null;
const RADIO = 28;
const CIRCUNFERENCIA = 2 * Math.PI * RADIO;

function iconoTipo(tipo) {
  return tipo === "lavadora" ? "🫧" : "🌀";
}

function calcularProgreso(m) {
  if (m.estado === "en_uso" && m.sesion) {
    const inicio = new Date(m.sesion.hora_inicio + "Z").getTime();
    const fin = new Date(m.sesion.hora_fin_estimada + "Z").getTime();
    const ahora = Date.now();
    const pct = Math.min(1, Math.max(0, (ahora - inicio) / (fin - inicio)));
    return pct;
  }
  if (m.estado === "finalizado") return 1;
  return 0;
}

function formatearRestante(finISO) {
  const fin = new Date(finISO + "Z");
  const ahora = new Date();
  let diffMs = fin - ahora;
  if (diffMs < 0) diffMs = 0;
  const totalSeg = Math.floor(diffMs / 1000);
  const min = Math.floor(totalSeg / 60);
  const seg = totalSeg % 60;
  return `${min}:${seg.toString().padStart(2, "0")}`;
}

function porthole(m) {
  const pct = calcularProgreso(m);
  const offset = CIRCUNFERENCIA * (1 - pct);
  return `
    <div class="porthole">
      <svg viewBox="0 0 70 70">
        <circle class="pista" cx="35" cy="35" r="${RADIO}"></circle>
        <circle class="progreso" cx="35" cy="35" r="${RADIO}"
          stroke-dasharray="${CIRCUNFERENCIA}"
          stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="icono-centro">${iconoTipo(m.tipo)}</div>
    </div>
  `;
}

// ---------- Alerta sonora (gratuita, generada en el navegador, sin archivos externos) ----------
let estadosAnteriores = {};
let audioCtx = null;

function reproducirAlerta() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ahora = audioCtx.currentTime;
    [0, 0.18].forEach(retraso => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, ahora + retraso);
      gain.gain.exponentialRampToValueAtTime(0.25, ahora + retraso + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ahora + retraso + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(ahora + retraso);
      osc.stop(ahora + retraso + 0.4);
    });
  } catch (e) { /* algunos navegadores requieren una interacción previa del usuario; se ignora si falla */ }
}

function detectarNuevosFinalizados(maquinas) {
  let hayNuevo = false;
  maquinas.forEach(m => {
    const anterior = estadosAnteriores[m.id];
    if (m.estado === "finalizado" && anterior && anterior !== "finalizado") {
      hayNuevo = true;
    }
    estadosAnteriores[m.id] = m.estado;
  });
  if (hayNuevo) reproducirAlerta();
}

function render() {
  const gridLav = document.getElementById("grid-lavadoras");
  const gridSec = document.getElementById("grid-secadoras");
  gridLav.innerHTML = "";
  gridSec.innerHTML = "";

  const lav = maquinasCache.filter(m => m.tipo === "lavadora");
  const sec = maquinasCache.filter(m => m.tipo === "secadora");
  document.getElementById("conteo-lavadoras").textContent =
    `· ${lav.filter(m => m.estado === "disponible").length} disponibles de ${lav.length}`;
  document.getElementById("conteo-secadoras").textContent =
    `· ${sec.filter(m => m.estado === "disponible").length} disponibles de ${sec.length}`;

  maquinasCache.forEach(m => {
    const div = document.createElement("div");
    div.className = `maquina ${m.estado}`;
    div.onclick = () => abrirDetalle(m);

    let textoEstado = {
      disponible: "Disponible",
      en_uso: "En uso",
      finalizado: "Terminó",
      mantenimiento: "Servicio"
    }[m.estado];

    let extra = "";
    if (m.estado === "en_uso" && m.sesion) {
      extra = `<div class="cliente-nombre">${m.sesion.cliente_nombre}</div>
               <div class="tiempo-restante" data-fin="${m.sesion.hora_fin_estimada}">${formatearRestante(m.sesion.hora_fin_estimada)}</div>`;
    } else if (m.estado === "finalizado" && m.sesion) {
      extra = `<div class="cliente-nombre">${m.sesion.cliente_nombre}</div>
               <div class="tiempo-restante">Listo</div>`;
    }

    div.innerHTML = `
      ${porthole(m)}
      <div class="num-maquina">${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${m.numero}</div>
      <div class="estado-txt">${textoEstado}</div>
      ${extra}
    `;

    if (m.tipo === "lavadora") gridLav.appendChild(div);
    else gridSec.appendChild(div);
  });
}

function abrirDetalle(m) {
  maquinaSeleccionada = m;
  if (m.estado === "disponible") {
    document.getElementById("titulo-iniciar").textContent =
      `${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${m.numero}`;
    document.getElementById("input-nombre").value = "";
    document.getElementById("input-telefono").value = "";
    document.getElementById("input-duracion").value = m.tipo === "lavadora" ? 35 : 45;
    document.getElementById("overlay-iniciar").classList.add("show");
  } else if (m.estado === "mantenimiento") {
    document.getElementById("titulo-detalle").textContent =
      `${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${m.numero}`;
    document.getElementById("detalle-contenido").innerHTML =
      `<div class="info-linea"><span>Estado</span><span>En mantenimiento</span></div>`;
    document.getElementById("btn-liberar").style.display = "none";
    document.getElementById("btn-whatsapp").style.display = "none";
    document.getElementById("overlay-detalle").classList.add("show");
  } else {
    document.getElementById("btn-liberar").style.display = "block";
    document.getElementById("titulo-detalle").textContent =
      `${m.tipo === "lavadora" ? "Lavadora" : "Secadora"} ${m.numero}`;
    const s = m.sesion;
    let html = "";
    if (s) {
      html += `<div class="info-linea"><span>Cliente</span><span>${s.cliente_nombre}</span></div>`;
      html += `<div class="info-linea"><span>Teléfono</span><span>${s.cliente_telefono || "No registrado"}</span></div>`;
      html += `<div class="info-linea"><span>Duración</span><span>${s.duracion_minutos} min</span></div>`;
      html += `<div class="info-linea"><span>Estado</span><span>${m.estado === "en_uso" ? "En funcionamiento" : "Ciclo terminado"}</span></div>`;
    }
    document.getElementById("detalle-contenido").innerHTML = html;

    // El botón de WhatsApp solo tiene sentido cuando el ciclo ya terminó
    const btnWa = document.getElementById("btn-whatsapp");
    if (m.estado === "finalizado" && s) {
      btnWa.style.display = "block";
      btnWa.textContent = s.cliente_telefono ? "Avisar por WhatsApp" : "Agregar teléfono para avisar";
    } else {
      btnWa.style.display = "none";
    }
    document.getElementById("overlay-detalle").classList.add("show");
  }
}

function formatearNumeroPeru(telefono) {
  // Limpia el número y le agrega el código de país (51) si hace falta,
  // para que el enlace de WhatsApp funcione sin que el personal tenga que escribirlo.
  let limpio = telefono.replace(/[^0-9]/g, "");
  if (limpio.length === 9) limpio = "51" + limpio;      // celular peruano típico: 9XXXXXXXX
  return limpio;
}

async function avisarWhatsApp() {
  const s = maquinaSeleccionada.sesion;
  let telefono = s.cliente_telefono;

  if (!telefono) {
    telefono = prompt("No hay teléfono registrado para este cliente.\nIngresa el número de WhatsApp:");
    if (!telefono) return;
    // Guardamos el teléfono en el ciclo actual para no volver a pedirlo
    await fetch(`/api/maquinas/${maquinaSeleccionada.id}/telefono`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telefono }),
    });
  }

  const numero = formatearNumeroPeru(telefono);
  const nombreMaquina = `${maquinaSeleccionada.tipo === "lavadora" ? "lavadora" : "secadora"} ${maquinaSeleccionada.numero}`;
  const mensaje = `Hola ${s.cliente_nombre}, tu ropa en la ${nombreMaquina} ya está lista. Puedes pasar a recogerla cuando gustes. ¡Gracias por tu preferencia!`;
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

function cerrarModal() {
  document.getElementById("overlay-iniciar").classList.remove("show");
  document.getElementById("overlay-detalle").classList.remove("show");
  maquinaSeleccionada = null;
}

async function confirmarInicio() {
  const nombre = document.getElementById("input-nombre").value.trim();
  const telefono = document.getElementById("input-telefono").value.trim();
  const duracion = parseInt(document.getElementById("input-duracion").value, 10);

  if (!nombre) {
    alert("Por favor ingresa el nombre del cliente.");
    return;
  }
  await fetch(`/api/maquinas/${maquinaSeleccionada.id}/iniciar`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      cliente_nombre: nombre,
      cliente_telefono: telefono || null,
      duracion_minutos: duracion || null,
    }),
  });
  cerrarModal();
}

async function confirmarLiberar() {
  await fetch(`/api/maquinas/${maquinaSeleccionada.id}/liberar`, { method: "POST" });
  cerrarModal();
}

// ---------- Usuario actual / sesión ----------
async function cargarUsuarioActual() {
  const resp = await fetch("/api/me");
  if (resp.status === 401) {
    window.location.href = "/login";
    return;
  }
  miUsuario = await resp.json();
  document.getElementById("usuario-info").textContent = `${miUsuario.nombre}`;
  if (miUsuario.rol === "dueno") {
    document.getElementById("btn-usuarios").style.display = "inline-block";
  }
}

async function cerrarSesion() {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login";
}

// ---------- Gestión de usuarios (panel del dueño) ----------
async function abrirUsuarios() {
  await cargarListaUsuarios();
  document.getElementById("overlay-usuarios").classList.add("show");
}
function cerrarModalUsuarios() {
  document.getElementById("overlay-usuarios").classList.remove("show");
}

async function cargarListaUsuarios() {
  const resp = await fetch("/api/usuarios");
  if (!resp.ok) return;
  const usuarios = await resp.json();
  const cont = document.getElementById("lista-usuarios");
  cont.innerHTML = usuarios.map(u => `
    <div class="info-linea">
      <span>${u.nombre} <span style="color:var(--muted); font-size:0.75rem;">(${u.username} · ${u.rol === "dueno" ? "Dueño" : "Personal"})</span></span>
      ${u.id !== miUsuario.id ? `<span style="color:#E8590C; cursor:pointer; font-weight:600;" onclick="eliminarUsuario(${u.id})">Quitar</span>` : `<span style="color:var(--muted); font-size:0.78rem;">Tú</span>`}
    </div>
  `).join("");
}

async function crearUsuario() {
  const nombre = document.getElementById("nu-nombre").value.trim();
  const username = document.getElementById("nu-username").value.trim();
  const password = document.getElementById("nu-password").value;
  const rol = document.getElementById("nu-rol").value;

  if (!nombre || !username || !password) {
    alert("Completa todos los campos.");
    return;
  }
  const resp = await fetch("/api/usuarios", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nombre, username, password, rol }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    alert(data.detail || "No se pudo crear el usuario.");
    return;
  }
  document.getElementById("nu-nombre").value = "";
  document.getElementById("nu-username").value = "";
  document.getElementById("nu-password").value = "";
  await cargarListaUsuarios();
}

async function eliminarUsuario(id) {
  if (!confirm("¿Quitar el acceso a este usuario?")) return;
  await fetch(`/api/usuarios/${id}`, { method: "DELETE" });
  await cargarListaUsuarios();
}

// ---------- WebSocket ----------
function conectarWS() {
  const protocolo = window.location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${protocolo}://${window.location.host}/ws`);
  const badge = document.getElementById("conexion");

  ws.onopen = () => {
    badge.textContent = "En vivo";
    badge.className = "estado-conexion ok";
  };
  ws.onclose = (event) => {
    if (event.code === 4401) {
      window.location.href = "/login";
      return;
    }
    badge.textContent = "Reconectando…";
    badge.className = "estado-conexion mal";
    setTimeout(conectarWS, 2000);
  };
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.evento === "actualizacion") {
      detectarNuevosFinalizados(data.maquinas);
      maquinasCache = data.maquinas;
      render();
    }
  };
}

// Actualiza contadores y anillos de progreso cada segundo sin esperar al servidor
setInterval(() => {
  document.querySelectorAll(".tiempo-restante[data-fin]").forEach(el => {
    el.textContent = formatearRestante(el.getAttribute("data-fin"));
  });
  document.querySelectorAll(".maquina.en_uso .progreso").forEach((circulo, i) => {
    // recalcular solo para las máquinas en uso, en el mismo orden en que se dibujaron
  });
  // Repintar anillos de progreso de las máquinas en uso (más simple y consistente que indexar)
  const enUso = maquinasCache.filter(m => m.estado === "en_uso");
  if (enUso.length) render();
}, 1000);

cargarUsuarioActual();
conectarWS();
</script>
